const DATA=[{"question":"Бірдей температура мен қысымда идеал газдарға қатысты дұрыс тұжырымдарды анықтаңыз.","options":["Газдардың тең көлемдеріндегі молекулалар саны бірдей болады.","Газдардың тең көлемдеріндегі молекулалар саны молярлық массаға пропорционал болады.","Газдардың тең көлемдерінің массалары молярлық массаларына пропорционал болады.","Газдардың тең массалары міндетті түрде бірдей көлем алады.","Газдардың тең мөлшерлері бірдей жағдайда тең көлем алады.","Газдардың тығыздықтары бірдей жағдайда молярлық массаларына кері пропорционал болады.","Газдардың тең көлемдерінің массалары олардың молярлық массаларына кері пропорционал болады."],"correct":[0,2,4],"explanation":"Авогадро заңы бойынша бірдей T және p жағдайында тең көлемдерде молекулалар саны бірдей; ρ=pM/(RT)."},{"question":"2H₂ + O₂ → 2H₂O реакциясында бастапқы 5 моль H₂ және 2 моль O₂ толық әрекеттескенде дұрыс нәтижелерді таңдаңыз.","options":["4 моль H₂ жұмсалады.","5 моль H₂ жұмсалады.","2 моль O₂ жұмсалады.","2,5 моль O₂ жұмсалады.","4 моль H₂O түзіледі.","5 моль H₂O түзіледі.","2 моль H₂ артық қалады.","1 моль O₂ артық қалады."],"correct":[0,2,4],"explanation":"Шектеуші реагент O₂: 2 моль O₂ 4 моль H₂ жұмсап, 4 моль су түзеді; 1 моль сутек артық қалады."},{"question":"Fe + CuSO₄ → FeSO₄ + Cu реакциясына қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Темірдің тотығу дәрежесі 0-ден +2-ге өзгереді.","Темірдің тотығу дәрежесі 0-ден -2-ге өзгереді.","Мыс ионының тотығу дәрежесі +2-ден 0-ге өзгереді.","Мыс ионының тотығу дәрежесі +2-ден +4-ке өзгереді.","Темір атомы екі электрон береді.","Мыс ионы екі электрон береді.","Сульфат ионы электрон алмасудың негізгі қатысушысы болады."],"correct":[0,2,4],"explanation":"Fe⁰ → Fe²⁺ + 2e⁻; Cu²⁺ + 2e⁻ → Cu⁰. Сульфат ионы - бақылаушы ион."},{"question":"MnO₂ + 4HCl → MnCl₂ + Cl₂ + 2H₂O реакциясының электрондық балансын сипаттайтын дұрыс тұжырымдарды таңдаңыз.","options":["Mn(+4) екі электрон қабылдап Mn(+2)-ге айналады.","Mn(+4) екі электрон беріп Mn(+2)-ге айналады.","Екі Cl(-1) ионы екі электрон беріп Cl₂ түзеді.","Екі Cl(-1) ионы екі электрон қабылдап Cl₂ түзеді.","MnO₂ тотықтырғыш ретінде әрекет етеді.","MnO₂ тотықсыздандырғыш ретінде әрекет етеді.","HCl құрамындағы сутек +1-ден 0-ге өзгереді."],"correct":[0,2,4],"explanation":"Марганец +4-тен +2-ге дейін тотықсызданады, хлор -1-ден 0-ге дейін тотығады."},{"question":"Қышқыл мен негіздің сулы ерітіндідегі алмасу реакцияларына қатысты дұрыс тұжырымдарды таңдаңыз.","options":["HCl + NaOH → NaCl + H₂O теңдеуі бейтараптануды сипаттайды.","HCl + NaOH → NaCl + H₂ теңдеуі бейтараптануды сипаттайды.","H⁺ + OH⁻ → H₂O теңдеуі күшті қышқыл мен күшті негіз үшін қысқартылған иондық теңдеу болады.","Na⁺ + Cl⁻ → NaCl(s) теңдеуі сұйытылған ерітіндідегі негізгі қозғаушы күш болады.","HNO₃ + KOH → KNO₃ + H₂O теңдеуі бейтараптануды сипаттайды.","HNO₃ + KOH → KNO₂ + H₂O теңдеуі бейтараптануды сипаттайды."],"correct":[0,2,4],"explanation":"Күшті қышқыл мен күшті негіздің бейтараптануы су түзілуімен жүреді."},{"question":"Na₂SO₄(aq) + BaCl₂(aq) реакциясына қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Ba²⁺ + SO₄²⁻ → BaSO₄(s) қысқартылған иондық теңдеу болады.","Na⁺ + Cl⁻ → NaCl(s) қысқартылған иондық теңдеу болады.","BaSO₄ нашар еритін тұнба түрінде бөлінеді.","Na₂SO₄ пен BaCl₂ арасында электрон алмасу жүреді.","Na⁺ және Cl⁻ иондары бақылаушы иондар болады.","Ba²⁺ ионы реакцияда Ba⁰-ге дейін тотықсызданады."],"correct":[0,2,4],"explanation":"Тұнба түзілуінің қозғаушы күші - BaSO₄ ерігіштігінің аздығы; Na⁺ және Cl⁻ бақылаушы иондар."},{"question":"Қалыпты жағдайда газдардың молярлық көлемі 22,4 л/моль деп алынғанда дұрыс сәйкестіктерді таңдаңыз.","options":["0,50 моль газдың көлемі 11,2 л болады.","0,50 моль газдың көлемі 22,4 л болады.","1,25 моль газдың көлемі 28,0 л болады.","1,25 моль газдың көлемі 44,8 л болады.","2,00 моль газдың көлемі 44,8 л болады.","2,00 моль газдың көлемі 22,4 л болады."],"correct":[0,2,4],"explanation":"V=nVₘ; 0,5·22,4=11,2; 1,25·22,4=28; 2·22,4=44,8 л."},{"question":"Бірдей T және p жағдайында H₂, N₂ және CO₂ газдарының тығыздықтары туралы дұрыс тұжырымдарды таңдаңыз.","options":["CO₂ тығыздығы N₂ тығыздығынан жоғары.","H₂ тығыздығы N₂ тығыздығынан жоғары.","N₂ тығыздығы H₂ тығыздығынан жоғары.","H₂ тығыздығы CO₂ тығыздығынан жоғары.","CO₂ тығыздығы H₂ тығыздығынан жоғары.","N₂ мен CO₂ тығыздықтары бірдей болады."],"correct":[0,2,4],"explanation":"ρ=pM/(RT), молярлық массалар H₂=2, N₂=28, CO₂=44 г/моль."},{"question":"CaCO₃ → CaO + CO₂ реакциясы үшін дұрыс тұжырымдарды таңдаңыз.","options":["Реакция заттардың саны мен құрамы бойынша айырылу реакциясына жатады.","Реакция заттардың саны мен құрамы бойынша қосылу реакциясына жатады.","Көміртектің тотығу дәрежесі +4 күйінде сақталады.","Көміртектің тотығу дәрежесі +4-тен +2-ге өзгереді.","Кальцийдің тотығу дәрежесі +2 күйінде сақталады.","Кальцийдің тотығу дәрежесі +2-ден 0-ге өзгереді.","Реакция барысында көміртек пен кальций электрон алмасады."],"correct":[0,2,4],"explanation":"Карбонат ыдырағанда CaO мен CO₂ түзіледі; Ca, C және O тотығу дәрежелері өзгермейді."},{"question":"N₂(g) + 3H₂(g) ⇌ 2NH₃(g) тепе-теңдігіне қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Қысымның жоғарылауы тепе-теңдікті NH₃ түзілу жағына ығыстырады.","Қысымның жоғарылауы тепе-теңдікті N₂ мен H₂ түзілу жағына ығыстырады.","Тура реакцияда газ молекулаларының жалпы стехиометриялық саны азаяды.","Тура реакцияда газ молекулаларының жалпы стехиометриялық саны артады.","Катализатор тепе-теңдікке жетуді жылдамдатады, бірақ тепе-теңдік константасын өзгертпейді.","Катализатор тепе-теңдік константасын міндетті түрде арттырады."],"correct":[0,2,4],"explanation":"Газ мольдері 4-тен 2-ге кемиді; қысым әсері Ле Шателье қағидасына сай, катализатор тепе-теңдікті ығыстырмайды."},{"question":"C(s) + O₂(g) → CO₂(g), ΔH = -393,5 кДж теңдеуіне қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Реакция экзотермиялық болады.","Реакция эндотермиялық болады.","1 моль көміртек толық жанғанда 393,5 кДж жылу бөлінеді.  → BaSO₄↓ + 2NaCl"],"correct":[0,4,5],"explanation":"BaSO₄, AgCl және Cu(OH)₂ ерімейтін тұнбалар; қалған теңдеулерде ерітіндіде реакцияны ілгерілететін фактор жоқ."},{"question":"Қышқыл тұздардың формулаларын анықтаңыз.","options":["K₂HPO₄","K₃PO₄","Na₂HPO₄","NaHCO₃","Na₂CO₃","Na₂SO₄","Ca₃(PO₄)₂"],"correct":[3],"explanation":"Қышқыл тұз анионының құрамында қышқылдан қалған алмастырылатын сутек болады."},{"question":"Негіздік тұздарға жататын қосылыстарды таңдаңыз.","options":["Cu₂(OH)₂CO₃","CuCO₃","MgCl₂","NaHCO₃","Al(OH)₂Cl","AlCl₃","Mg(OH)Cl"],"correct":[0,4,6],"explanation":"Негіздік тұз құрамында металл катионымен бірге гидроксотоп және қышқыл қалдығы болады."},{"question":"Екідайлы гидроксидтердің формулаларын таңдаңыз.","options":["Ba(OH)₂","Fe(OH)₂","KOH","Ca(OH)₂","Al(OH)₃","Cu(OH)₂","NaOH"],"correct":[4],"explanation":"Al(OH)₃, Zn(OH)₂ және Cr(OH)₃ қышқылдармен де, күшті сілтілермен де әрекеттеседі."},{"question":"Бейтарап оксидтерді анықтаңыз.","options":["Al₂O₃","SO₂","CO₂","SO₂","P₂O₅","CO","CaO"],"correct":[5],"explanation":"CO, NO және N₂O әдеттегі қышқылдық-негіздік жіктеуде бейтарап оксидтер болып саналады."},{"question":"Оксидтердің қышқылдық сипаты басым болатын қатарларды таңдаңыз.","options":["Na₂O, K₂O, CaO","CO₂, SO₂, SiO₂","CO, NO, N₂O","MgO, BaO, SrO","SO₃, P₂O₅, N₂O₅","CO, NO, N₂O"],"correct":[1,4],"explanation":"Жоғары тотығу дәрежелі бейметалл оксидтері және кейбір жоғары тотығу дәрежелі металл оксидтері қышқылдық қасиет көрсетеді."},{"question":"III периодта солдан оңға қарай гидроксидтердің қышқылдық-негіздік қасиеттерінің өзгеруін дұрыс сипаттайтын тұжырымдарды таңдаңыз.","options":["Al(OH)₃ күшті сілті ретінде толық диссоциацияланады.","H₃PO₄ қышқылдық қасиет көрсетеді.","Mg(OH)₂ айқын амфотерлі қасиет көрсетеді.","NaOH амфотерлі қасиет көрсетеді.","H₃PO₄ негіздік гидроксидке жатады.","NaOH айқын негіздік қасиет көрсетеді."],"correct":[1,5],"explanation":"Период бойынша металдық сипат әлсіреп, гидроксидтердің негіздік қасиеті кеміп, қы ын сипаттайды."},{"question":"Қатты зат қатысатын гетерогенді тепе-теңдіктің өрнегін анықтаңыз: CaCO₃(s) ⇌ CaO(s)+CO₂(g).","options":["Таза қатты CaCO₃ активтілігі нөл деп алынады","Kp = p(CO₂) (стандартты қысымға қатысты өлшемсіз түрде)","Kp = 1/p(CO₂)","Kp = p(CaO)·p(CO₂)/p(CaCO₃)","Таза қатты CaO активтілігі 1 деп алынады","Kp тек қатты заттардың массасына тәуелді"],"correct":[1,4],"explanation":"Таза қатты фазалардың активтілігі 1, сондықтан өрнекке CO₂ ғана кіреді."},{"question":"2SO₂(g)+O₂(g) ⇌ 2SO₃(g) реакциясында газ көлемін азайтқанда дұрыс қорытындыларды таңдаңыз.","options":["Газ мольдерінің саны екі жақта бірдей","Тура бағытта газ мольдерінің саны 3-тен 2-ге кемиді","Температура өзгермесе, Kp тұрақты қалады","Тепе-теңдік міндетті түрде SO₂ жағына ығысады","Kp көлем азайғандықтан міндетті түрде артады","Тепе-теңдік SO₃ түзілу жағына ығысуы мүмкін"],"correct":[1,2,5],"explanation":"Көлем азайғанда қысым өсіп, газ мольдері аз бағыт қолайланады."},{"question":"Реакцияның жылдамдығын тәжірибеде анықтау тәсілдерін таңдаңыз.","options":["Өнім концентрациясының уақыт бойынша кемуін өлшеу","Газ бөлінсе, оның көлемінің уақыт бойынша өзгерісін өлшеу","Тек реакцияның атауын оқу","Тек өнімдердің молярлық массасын салыстыру","Тек теңдеудегі коэффициенттерді санау","Реагент концентрациясының уақыт бойынша кемуін өлшеу"],"correct":[1,5],"explanation":"Реакция жылдамдығы концентрацияның не басқа өлшенетін шаманың уақыт бойынша өзгерісінен табылады."},{"question":"Элементар реакция мен жалпы реакция реттілігі туралы дұрыс тұжырымдарды таңдаңыз.","options":["Кез келген күрделі реакцияның реттілігі коэффициенттер қосындысына тең","Молекулалықтық кез келген нақты сан бола алады","Күрделі реакцияның реттілігі тәжірибе арқылы анықталады","Жалпы теңдеудің коэффициенттері әрқашан кинетикалық реттілікті бермейді","Реакция реттілігі тек өнімдердің санына тәуелді","Элементар саты үшін молекулалықтық соқтығысатын бөлшектер санымен байланысты"],"correct":[2,3,5],"explanation":"Күрдел ыстыру жүйенің тепе-теңдікке қай бағытта жылжитынын анықтайды."},{"question":"Газ реакциялары үшін Kp және Kc арасындағы байланысты таңдаңыз.","options":["Kp = Kc(RT)^Δn өрнегі идеал газға қолданылады","Δn газ өнімдері мен газ реагенттерінің моль сандарының қосындысы","Kp пен Kc арасында ешқандай байланыс жоқ","Δn қатты заттардың моль сандарын ғана қамтиды","Kp = Kc(RT)^(-Δn) әрқашан дұрыс","Δn = 0 болса, сәйкес келісімде Kp = Kc"],"correct":[0,5],"explanation":"Идеал газдар үшін Kp = Kc(RT)^Δn байланысы пайдаланылады."},{"question":"Кинетикалық деректерден реакция реттілігін анықтау туралы дұрыс тұжырымдарды таңдаңыз.","options":["Бір реагенттің концентрациясын екі есе арттырғанда жылдамдық төрт есе өссе, сол реагент бойынша реттілік 2 болуы мүмкін","Басқа жағдайлар тұрақты болғанда тәжірибелік жылдамдықтар реттілікті табуға көмектеседі","Реттілікті тек теңдеу коэффициенттерінен алуға болады","Концентрация өзгерісі ешқашан жылдамдыққа әсер етпейді","Реттілік әрқашан тек 1 болады","Концентрацияны өзгертіп, бастапқы жылдамдықтарды салыстыруға болады"],"correct":[0,1,5],"explanation":"Бастапқы жылдамдықтар әдісі концентрация дәрежелерін тәжірибе арқылы табуға мүмкіндік береді."},{"question":"Ерітінділердің физикалық-химиялық табиғатына сәйкес келетін тұжырымдарды таңдаңыз.","options":["Еру кезінде сольваттану құбылысы жүруі мүмкін.","Ерітінді міндетті түрде екі бөлек фазадан тұрады.","Ерітінді құрамында еріткіш пен еріген зат болады.","Ерітінді біртекті жүйе болып саналады.","Ерітінді түзілуі әрқашан жылу бөлумен жүреді.","Ерітінді құрамы әрқашан тұрақты стехиометриялық қатынаста болады."],"correct":[0,2,3],"explanation":"Ерітінділер гомогенді жүйелер; олардың құрамы өзгермелі, ал еріген бөлшектер еріткішпен әрекеттесе алады."},{"question":"Судағы еріген бөлшектердің гидраттануын дұрыс сипаттайтын тұжырымдарды таңдаңыз.","options":["Гидраттану еріткіштің толық булануын білдіреді.","Гидраттану еріген бөлшектердің су молекулаларымен әрекеттесуін білдіреді.","Гидраттану function scoreChapter(c){const st=states[c];let points=0,exact=0,answered=0;CHAPTERS[c]&&DATA.slice(CHAPTERS[c].start,CHAPTERS[c].end).forEach((q,j)=>{const a=st.answers[j];if(a.length)answered++;const missing=q.correct.filter(x=>!a.includes(x)).length;const extra=a.filter(x=>!q.correct.includes(x)).length;const errors=missing+extra;if(errors===0){points+=2;exact++}else if(errors===1)points+=1});return {points,exact,answered,total:CHAPTERS[c].end-CHAPTERS[c].start}}

 article.append(el('div','qnum',`${j+1}-сұрақ`),el('h3','',q.question));
 q.options.forEach((option,k)=>{const chosen=st.answers[j].includes(k);const label=el('label','opt');if(revealed){if(q.correct.includes(k))label.classList.add('correct');else if(chosen)label.classList.add('incorrect');if(chosen)label.classList.add('selected')}
 const input=document.createElement('input');input.type='checkbox';input.checked=chosen;input.disabled=revealed;input.addEventListener('change',()=>{if(input.checked){if(st.answers[j].length>=3){input.checked=false;alert('Ең көбі үш жауап таңдауға болады.');return}st.answers[j].push(k)}else st.answers[j]=st.answers[j].filter(x=>x!==k)});label.append(input,el('span','',`${LETTERS[k]}) ${option}`));article.append(label)});
 if(st.mode==='quiz'&&!st.finished&&!revealed){const check=el('button','', 'Жауапты тексеру');check.addEventListener('click',()=>{if(!st.answers[j].length){alert('Алдымен жауапты таңдаңыз.');return}st.revealed.add(j);refreshChapter(c)});article.append(check)}
 if(revealed){const box=el('div','explanation');const chosen=st.answers[j];const ok=equal(chosen,q.correct);box.append(el('strong','',ok?'Дұрыс жауап':'Жауапты талдау'));box.append(el('p','',`Сіздің таңдауыңыз: ${chosen.length?chosen.map(x=>LETTERS[x]).join(', '):'Жауап таңдалмаған'}`));box.append(el('p','',`Дұрыс жауаптар: ${q.correct.map(x=>LETTERS[x]).join(', ')}`));box.append(el('p','',q.explanation));article.append(box)}return article}
function refreshChapter(c){const ch=CHAPTERS[c],st=states[c],sec=document.getElementById(`chapter-${c+1}`);const old=sec.querySelector('.chapter-body');const body=el('div','chapter-body');
 const bar=el('div','toolbar');['quiz','test'].forEach(m=>{const b=el('button',st.mode===m?'active':'',m==='quiz'?'Quiz':'Test');b.disabled=st.finished;b.addEventListener('click',()=>{if(st.mode===m)return;const hasAnswers=st.answers.some(a=>a.length)||st.revealed.size>0;if(hasAnswers&&!confirm('Режим ауысқанда осы тараудағы жауаптар өшіріледі. Жалғастырасыз ба?'))return;st.mode=m;st.answers=Array.from({length:ch.end-ch.start},()=>[]);st.revealed=new Set();st.finished=false;refreshChapter(c)});bar.append(b)});body.append(bar);
 body.append(el('p','hint',st.mode==='quiz'?'Жауаптарды таңдаңыз, әр сұрақты жеке тексеріңіз немесе тараудың соңында жалпы нәтижені ашыңыз.':'Жауаптарды таңдаңыз. Дұрыс жауаптар мен түсіндірмелер тараудың соңындағы нәтижені ашқанда көрсетіледі.'));
 for(let j=0;j<ch.end-ch.start;j++)body.append(showQuestion(c,j));
 if(!st.finished){const finish=el('button','chapter-finish','Тарау нәтижесін көрсету');finish.addEventListener('click',()=>{st.finished=true;refreshChapter(c);const score=document.getElementById(`score-${c+1}`);score.scrollIntoView({behavior:'smooth',block:'center'})});body.append(finish)}
 else{const sc=scoreChapter(c);const box=el('div','score');box.id=`score-${c+1}`;box.append(el('strong','',`Тарау нәтижесі: ${sc.points} / ${sc.total*2} ұпай`));box.append(el('p','',`Толық дұрыс жауаптар: ${sc.exact} / ${sc.total}. Жауап берілген сұрақтар: ${sc.answered} / ${sc.total}.`));box.append(el('p','',`Әр сұрақтың астында сіз таңдаған нұсқалар, дұрыс жауаптар және түсіндірме көрсетілді.`));body.insertBefore(box,body.children[2]);const reset=el('button','chapter-finish','Тарауды қайта бастау');reset.addEventListener('click',()=>{st.answers=Array.from({length:ch.end-ch.start},()=>[]);st.revealed=new Set();st.finished=false;refreshChapter(c)});body.append(reset)}old.replaceWith(body)}
CHAPTERS.forEach((ch,c)=>{const link=el('a','chapter-link');link.href=`#chapter-${c+1}`;link.append(el('strong','',`${c+1}-тарау`),el('span','',ch.title),el('small','',`${ch.end-ch.start} сұрақ`));nav.append(link);
 const section=el('section','chapter');section.id=`chapter-${c+1}`;const heading=el('div','chapter-head');heading.append(el('h2','',`${c+1}-тарау. ${ch.title}`),el('span','muted',`${ch.end-ch.start} сұрақ`));section.append(heading,el('div','chapter-body'));root.append(section);refreshChapter(c)});
</script></body></html>
